[package]
name = "rf-service"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Service order, slides, songs, timers, media rules, themes, live runner and crash-safe persistence (pure logic, no UI)"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
# .pptx files are zip files; we only read them. MIT. (No bzip2/zstd/aes: deflate only.)
zip = { version = "0.6", default-features = false, features = ["deflate"] }
